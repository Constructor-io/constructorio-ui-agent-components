name: Publish to npm

on:
  workflow_call:
    inputs:
      version:
        description: Version tag (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v1.2.3)
        required: true
        type: string

# Required for npm OIDC trusted publishers authentication
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Remove version prefix
        id: version
        uses: ./.github/actions/remove-version-prefix
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: 'npm'

      - name: Install npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Compile
        uses: ./.github/actions/compile
        with:
          version: ${{ inputs.version }}

      - name: Set package version
        run: |
          jq --arg v "${{ steps.version.outputs.without_prefix }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Publish to npm
        run: npm publish --access public

      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # v2.3.0
        with:
          status: ${{ job.status }}
          notification_title: 'New constructorio-ui-agent-components release published to npm at version ${{ steps.version.outputs.without_prefix }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
