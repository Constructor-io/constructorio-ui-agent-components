name: Publish to CDN

on:
  workflow_call:
    inputs:
      version:
        description: Version tag (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v1.2.3)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove version prefix
        id: version
        uses: ./.github/actions/remove-version-prefix
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: 'npm'

      - run: npm ci

      - name: Compile
        uses: ./.github/actions/compile
        with:
          version: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          mkdir -p s3_dist
          cp dist/standalone/constructorio-ui-agent-components.standalone.js s3_dist/${{ steps.version.outputs.without_prefix }}.js
          aws s3 sync s3_dist s3://constructor-frontend-prod/ui/agent-overview \
            --cache-control 'public, max-age=1800' \
            --acl 'public-read'

      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@bca2d7f5660b833a27bda4f6b8bef389ebfefd25 # v2.3.0
        with:
          status: ${{ job.status }}
          notification_title: 'New constructorio-ui-agent-components release published to CDN at version ${{ inputs.version }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
