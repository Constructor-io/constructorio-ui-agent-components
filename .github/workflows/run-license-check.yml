name: License Check
on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: license-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-license
