name: Spell Check

on:
  pull_request:
    branches: ['**']
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: spell-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  spell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx cspell "**/*.{ts,tsx,js,jsx,md}"
